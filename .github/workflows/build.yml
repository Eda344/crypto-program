name: Build Flet APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 cryptography

      - name: Android Lisanslarini Onayla
        run: |
          yes | flutter doctor --android-licenses || true

      - name: APK Derle
        run: |
          flet build apk -v

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: flet-app-apk
          path: build/apk/*.apk
